name: Deploy documentation site to Cloudflare Pages

on:
  push:
    branches:
      - feat/docs-web-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DOCS_SOURCE_REF: origin/main
      DOCS_AUTO_FETCH: "true"
      SITE_BASE_PATH: ""

    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build site
        run: yarn build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=team-handbook --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

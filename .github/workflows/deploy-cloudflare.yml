name: Deploy documentation site to Cloudflare Pages

on:
  push:
    branches:
      - feat/docs-web-pages
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DOCS_SOURCE_REF: origin/main
      DOCS_AUTO_FETCH: "true"
      SITE_BASE_PATH: ""

    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build site
        run: yarn build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=team-handbook
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
